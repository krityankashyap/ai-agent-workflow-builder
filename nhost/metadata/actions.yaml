actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{FUNCTIONS_INTERNAL_URL}}/approveStep'
    permissions:
      - role: user
    comment: Approve a paused approval_gate step and resume the run.
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{FUNCTIONS_INTERNAL_URL}}/triggerWorkflowRun'
    permissions:
      - role: user
    comment: Start a workflow run; handler enforces org role + quota.
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
