table:
  name: workflows
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: stats
    using:
      manual_configuration:
        column_mapping:
          id: workflow_id
        insertion_order: null
        remote_table:
          name: workflow_run_stats
          schema: public
array_relationships:
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        org:
          members:
            role:
              _in:
                - owner
                - editor
            user_id:
              _eq: X-Hasura-User-Id
      set:
        created_by: x-hasura-user-id
      columns:
        - org_id
        - name
        - description
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_by
        - created_at
        - updated_at
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
      filter:
        org:
          members:
            role:
              _in:
                - owner
                - editor
            user_id:
              _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
