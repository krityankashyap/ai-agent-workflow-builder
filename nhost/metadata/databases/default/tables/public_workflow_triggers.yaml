table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _and:
              - type:
                  _neq: webhook
              - workflow:
                  org:
                    members:
                      role:
                        _in:
                          - owner
                          - editor
                      user_id:
                        _eq: X-Hasura-User-Id
          - _and:
              - type:
                  _eq: webhook
              - workflow:
                  org:
                    members:
                      role:
                        _eq: owner
                      user_id:
                        _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - type
        - config
        - secret
        - enabled
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - enabled
        - created_at
      filter:
        workflow:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - config
        - enabled
        - secret
      filter:
        workflow:
          org:
            members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
      check:
        _or:
          - _and:
              - type:
                  _neq: webhook
              - workflow:
                  org:
                    members:
                      role:
                        _in:
                          - owner
                          - editor
                      user_id:
                        _eq: X-Hasura-User-Id
          - _and:
              - type:
                  _eq: webhook
              - workflow:
                  org:
                    members:
                      role:
                        _eq: owner
                      user_id:
                        _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          org:
            members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
