table:
  name: notifications
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: run
    using:
      foreign_key_constraint_on: run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - run_id
        - channel
        - message
        - status
        - delivered_at
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_deliver
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 2
      timeout_sec: 60
    webhook_from_env: NOTIFY_WEBHOOK_URL
