table:
  name: step_runs
  schema: public
object_relationships:
  - name: run
    using:
      foreign_key_constraint_on: run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - run_id
        - step_id
        - position
        - step_type
        - status
        - input
        - output
        - error
        - attempt
        - approved_by
        - approved_at
        - started_at
        - finished_at
        - created_at
      filter:
        run:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id
