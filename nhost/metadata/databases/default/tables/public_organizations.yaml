table:
  name: organizations
  schema: public
array_relationships:
  # organizations -> org_members (the membership rows for this org).
  # Named "members" so permission filters read as `members.user_id`.
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - plan
        - quota_limit
        - quota_used
        - quota_period_start
        - created_at
      # ISOLATION CORE: a user may read an org only if they are a member of it.
      # X-Hasura-User-Id comes from the validated JWT, so guessing an org id
      # returns zero rows for a non-member.
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
