table:
  name: organizations
  schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - plan
        - quota_limit
        - quota_used
        - quota_period_start
        - created_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
